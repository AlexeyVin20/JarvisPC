[project]
name = "jarvis-pc"
version = "0.1.0"
description = "Personal Jarvis assistant — web + headless, profiles & memory from VoxRelay, web search from VoiceAgent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=14",
    "httpx>=0.28",
    "asyncpg>=0.30",
    "numpy>=2.0",
    "selectolax==0.4.11",
    "markdownify>=1.0",
    "datasketch>=1.6",
    "scikit-learn>=1.5",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
